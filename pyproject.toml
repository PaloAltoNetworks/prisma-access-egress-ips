[project]
name = "prisma-access-egress-ips"
version = "0.1.0"
description = "Web utility for querying Prisma Access egress IPs"
# Pinned to the minor shipped by the distroless runtime image (python3-debian13).
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "certifi>=2024.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
