services:
  app:
    build: .
    # Only this machine can reach it; see docs/deployment.md before exposing it further
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
