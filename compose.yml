# Use this file to run the utility using the pre-built image from GHCR.
# No local build or clone required — Docker is the only dependency.
#
#   docker compose up -d
#
# Open http://localhost:8000 once the container starts.
# :latest is the newest release, including a future major version that may need changes
# here. Pin :1 to stay on 1.x, :1.0 for patch releases only, or :1.0.0 for one exact
# release; see docs/deployment.md.

services:
  app:
    image: ghcr.io/paloaltonetworks/prisma-access-egress-ips:latest
    # Only this machine can reach it; see docs/deployment.md before exposing it further
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Behind SSL decryption, mount your organization's CA certificate(s); see docs/custom-ca.md
    # volumes:
    #   - ./certs:/certs:ro
